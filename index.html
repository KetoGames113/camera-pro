<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000"><title>كاميرا برو</title>
<style>
:root{--p:#1a1c21;--l:#2c2f37;--m:#9aa0ab;--a:#ffb703;--r:0deg}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;overflow:hidden;touch-action:none}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#top{display:flex;justify-content:space-around;padding:8px 6px}
#st{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#w{position:relative;overflow:hidden;background:#111}
#v{width:100%;height:100%;display:block;object-fit:fill}
#w canvas,#gr,#fl,#ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#gr{display:none}
#fl{background:#fff;opacity:0}#fl.go{animation:f .4s ease-out}@keyframes f{from{opacity:.95}to{opacity:0}}
#ring{inset:auto;width:70px;height:70px;border:2px solid var(--a);border-radius:50%;opacity:0;transform:translate(-50%,-50%)}
#ring.go{animation:rg .9s ease-out}@keyframes rg{0%{opacity:1;transform:translate(-50%,-50%) scale(1.6)}30%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
#lv{position:absolute;left:50%;top:50%;width:70%;height:0;border-top:2px solid #fff9;transform:translate(-50%,-50%);display:none;pointer-events:none;transition:border-color .2s}
#lv::before,#lv::after{content:"";position:absolute;top:-8px;width:2px;height:14px;background:inherit}#lv::before{left:0}#lv::after{right:0}
#lv.ok{border-color:#3ddc84}
#lt{position:absolute;top:44%;left:50%;transform:translate(-50%,-250%);font-size:13px;background:#0008;padding:2px 8px;border-radius:9px;display:none}
#bd{position:absolute;top:8px;inset-inline-start:8px;background:#0009;padding:4px 10px;border-radius:99px;font-size:12px}
#rc{position:absolute;top:8px;inset-inline-end:8px;background:#d62828;padding:4px 10px;border-radius:99px;font-size:13px;display:none;animation:bl 1s infinite}@keyframes bl{50%{opacity:.5}}
#cn{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:28vmin;font-weight:700;text-shadow:0 4px 30px #000a;pointer-events:none}
#ms{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--m);line-height:1.9;z-index:3}
#zb{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:#0007;border-radius:99px;padding:4px;z-index:2}
.z{min-width:38px;height:34px;border-radius:99px;border:0;background:transparent;color:#fff;font-size:13px}.z.on{background:var(--a);color:#111;font-weight:700}
#zr{position:absolute;bottom:52px;left:8%;width:84%;accent-color:var(--a);z-index:2}
.ic{transform:rotate(var(--r));transition:transform .3s}
.b{width:46px;height:46px;border-radius:50%;border:1px solid var(--l);background:#0005;color:#fff;font-size:19px}.b.on{background:var(--a);color:#111}
#bt{display:flex;align-items:center;justify-content:space-around;padding:10px 6px 14px}
#sh{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:none;position:relative;transition:.2s}
#sh::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff;transition:.15s}#sh:active::after{transform:scale(.82)}
#sh.vid::after{background:#d62828}#sh.rec::after{inset:21px;border-radius:9px;background:#d62828}
#th{width:46px;height:46px;border-radius:10px;border:1px solid var(--l);background:#222 center/cover}
.sheet{position:fixed;inset:auto 0 0 0;max-height:72%;overflow:auto;background:var(--p);border-radius:20px 20px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1);z-index:9;touch-action:pan-y}
.sheet.open{transform:none}.sheet h3{margin:0 0 8px;font-size:16px}
.row{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 10px}
.chip{border:1px solid var(--l);background:#0003;color:#fff;padding:7px 13px;border-radius:99px;font-size:13px;font-family:inherit}.chip.on{background:var(--a);color:#111;border-color:var(--a);font-weight:700}
label.s{display:block;margin:10px 0 3px;font-size:13px;color:var(--m)}label.s b{float:left;color:#fff;direction:ltr}
input[type=range]{width:100%;accent-color:var(--a)}
.tg{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--l);font-size:14px}
#gal{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}#gal img,#gal video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.mini{font-size:12px;color:var(--m);line-height:1.7;margin-top:8px}
#tt{position:fixed;top:12%;left:50%;transform:translateX(-50%);background:#000c;padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.3s;z-index:20;pointer-events:none}#tt.on{opacity:1}
</style></head><body>
<div id="app">
 <div id="top">
  <button class="b" id="bF" title="فلاش"><span class="ic">⚡</span></button>
  <button class="b" id="bH" title="HDR"><span class="ic" style="font-size:12px;font-weight:700">HDR</span></button>
  <button class="b" id="bT" title="مؤقت"><span class="ic">⏱</span></button>
  <button class="b" id="bG" title="شبكة"><span class="ic">▦</span></button>
  <button class="b" id="bL" title="مقياس الدوران"><span class="ic">📐</span></button>
  <button class="b" data-o="sF" title="فلاتر"><span class="ic">🎨</span></button>
  <button class="b" data-o="sS" title="إعدادات"><span class="ic">⚙️</span></button>
 </div>
 <div id="st">
  <div id="w"><video id="v" autoplay playsinline muted></video><canvas id="ovc"></canvas><div id="gr"></div><div id="lv"></div><div id="lt"></div><div id="fl"></div><div id="ring"></div>
   <div id="bd">—</div><div id="rc">● <span id="rt">00:00</span></div><div id="cn"></div></div>
  <div id="ms">جاري تشغيل الكاميرا…</div>
  <input type="range" id="zr" min="0.6" max="10" step="0.05" value="1">
  <div id="zb"></div>
 </div>
 <div id="bt">
  <div id="th" data-o="sG"></div>
  <button class="b" id="bM"><span class="ic">📷</span></button>
  <button id="sh" aria-label="التقاط"></button>
  <button class="b" id="bC" title="تبديل العدسة"><span class="ic">🔄</span></button>
  <button class="b" data-o="sP"><span class="ic">🎚</span></button>
 </div>
</div>

<div class="sheet" id="sF"><h3>الفلاتر</h3><div class="row" id="fR"></div><h3>الإطارات والأشكال</h3><div class="row" id="oR"></div>
<label class="s">السطوع <b id="v1">100%</b></label><input type="range" id="br" min="40" max="200" value="100">
<label class="s">التباين <b id="v2">100%</b></label><input type="range" id="co" min="40" max="200" value="100">
<label class="s">التشبع <b id="v3">100%</b></label><input type="range" id="sa" min="0" max="250" value="100"></div>

<div class="sheet" id="sP"><h3>أدوات الاحتراف</h3><div id="pro"></div></div>

<div class="sheet" id="sS"><h3>جودة الصورة والفيديو</h3><div class="row" id="qR"></div>
<h3>إطارات الفيديو</h3><div class="row" id="pR"><button class="chip on" data-fps="30">30</button><button class="chip" data-fps="60">60</button></div>
<div class="tg">تصوير متتالي (5 صور)<input type="checkbox" id="bu"></div>
<div class="tg">صوت الغالق<input type="checkbox" id="sn" checked></div>
<div class="tg">تسجيل الصوت بالفيديو<input type="checkbox" id="au" checked></div>
<div class="tg">حفظ السيلفي معكوس (مرآة)<input type="checkbox" id="mi"></div>
<div class="mini" id="cp"></div></div>

<div class="sheet" id="sG"><h3>المعرض</h3><div id="gal"></div><div class="mini">اضغط على أي عنصر لتحميله.</div></div>
<div id="tt"></div>

<script>
const $=i=>document.getElementById(i),v=$("v"),wp=$("w"),sl=ms=>new Promise(r=>setTimeout(r,ms));
const Q={max:{n:"أعلى جودة",w:7680,h:4320,cap:1e5,jq:.98,vb:5e7,s:1},high:{n:"عالية",w:1920,h:1080,cap:2560,jq:.9,vb:12e6,s:1},low:{n:"ضعيفة",w:640,h:360,cap:800,jq:.5,vb:1e6,s:1},vlow:{n:"ضعيفة جدا",w:320,h:240,cap:320,jq:.12,vb:1e5,s:.4}};
const F={none:["بدون",""],bw:["أبيض وأسود","grayscale(1)"],noir:["نوار","grayscale(1) contrast(1.5) brightness(.9)"],sepia:["قديم","sepia(.9)"],vintage:["فينتج","sepia(.4) contrast(1.15) saturate(1.3) hue-rotate(-10deg)"],cool:["بارد","saturate(1.2) hue-rotate(180deg)"],warm:["دافئ","sepia(.35) saturate(1.5) brightness(1.05)"],vivid:["حيوي","saturate(2) contrast(1.15)"],fade:["باهت","contrast(.8) brightness(1.15) saturate(.8)"],chrome:["كروم","contrast(1.3) saturate(1.4) brightness(1.05)"],sunset:["غروب","sepia(.5) saturate(2) hue-rotate(-20deg)"],inv:["معكوس","invert(1)"]};
const O={none:"بدون",vig:"تظليل",circ:"دائرة",heart:"قلب",star:"نجمة",film:"فيلم",pol:"بولارويد",leak:"تسريب ضوء",bokeh:"بوكيه"};
const PRO=[["exposureCompensation","التعريض EV"],["iso","ISO"],["exposureTime","سرعة الغالق"],["colorTemperature","توازن الأبيض K"],["focusDistance","التركيز اليدوي"]];
let q="max",f="none",ovT="none",facing="environment",devId=null,stream,track,ic,pc,caps={},cams=[],Z=1,hwZ=1,mode="photo",timer=0,fps=30,hdr=0,flash=0,gm=0,lvOn=0,rec,recT,items=[],roll=0,ang=0,asked=0;
const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
function toast(t){const e=$("tt");e.textContent=t;e.classList.add("on");clearTimeout(toast.i);toast.i=setTimeout(()=>e.classList.remove("on"),2200)}
const css=()=>`brightness(${$("br").value}%) contrast(${$("co").value}%) saturate(${$("sa").value}%) ${F[f][1]}`.trim();
const NEU="brightness(100%) contrast(100%) saturate(100%)";
const mirOut=()=>facing=="user"&&$("mi").checked;
const soft=()=>Math.max(1,Z/hwZ);

/* ---------- الإطارات والأشكال ---------- */
function shp(c,t,w,h){const cx=w/2,cy=h/2,r=Math.min(w,h)*.45;c.beginPath();
 if(t=="circ")c.arc(cx,cy,r,0,7);
 else if(t=="heart"){for(let i=0;i<=80;i++){const a=i/80*6.2832,x=16*Math.sin(a)**3,y=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));const px=cx+x*r/17*1.05,py=cy+y*r/17*1.05+r*.05;i?c.lineTo(px,py):c.moveTo(px,py)}}
 else for(let i=0;i<10;i++){const a=-1.5708+i*.6283,rr=i%2?r*.42:r;i?c.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a)):c.moveTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a))}
 c.closePath()}
function ov(c,w,h,t){if(t=="none")return;const m=Math.min(w,h);
 if(t=="vig"){const g=c.createRadialGradient(w/2,h/2,m*.3,w/2,h/2,Math.hypot(w,h)/2);g.addColorStop(0,"#0000");g.addColorStop(1,"#000c");c.fillStyle=g;c.fillRect(0,0,w,h)}
 else if(t=="leak"){const g=c.createLinearGradient(0,0,w,h*.6);g.addColorStop(0,"#ff6a00aa");g.addColorStop(.4,"#ff006640");g.addColorStop(1,"#0000");c.globalCompositeOperation="screen";c.fillStyle=g;c.fillRect(0,0,w,h);c.globalCompositeOperation="source-over"}
 else if(t=="film"){const b=h*.08;c.fillStyle="#000";c.fillRect(0,0,w,b);c.fillRect(0,h-b,w,b);c.fillStyle="#fff";for(let x=b/2;x<w;x+=b*1.2){c.fillRect(x,b*.3,b*.4,b*.4);c.fillRect(x,h-b*.7,b*.4,b*.4)}}
 else if(t=="pol"){const s=m*.05;c.fillStyle="#f6f3ea";c.fillRect(0,0,w,s);c.fillRect(0,0,s,h);c.fillRect(w-s,0,s,h);c.fillRect(0,h-s*3.5,w,s*3.5)}
 else if(t=="bokeh"){c.globalCompositeOperation="screen";for(let i=0;i<22;i++){const x=(Math.sin(i*12.9)*.5+.5)*w,y=(Math.sin(i*78.2)*.5+.5)*h,r=m*(.03+(i%5)*.018);c.fillStyle=`hsla(${30+i*14},90%,70%,.22)`;c.beginPath();c.arc(x,y,r,0,7);c.fill()}c.globalCompositeOperation="source-over"}
 else{shp(c,t,w,h);c.rect(w,0,-w,h);c.fillStyle="#000";c.fill("evenodd")}}
function drawOv(){const c=$("ovc");c.width=wp.clientWidth;c.height=wp.clientHeight;ov(c.getContext("2d"),c.width,c.height,ovT)}

/* ---------- الشاشة والمعاينة ---------- */
function fit(){const st=$("st"),ar=(v.videoWidth/v.videoHeight)||.75;let W=st.clientWidth,H=st.clientHeight;if(W/H>ar)W=H*ar;else H=W/ar;wp.style.width=W+"px";wp.style.height=H+"px";drawOv()}
function view(){v.style.transform=`scale(${(facing=="user"?-1:1)*soft()},${soft()})`;v.style.filter=css();
 ["v1","v2","v3"].forEach((k,i)=>$(k).textContent=[$("br"),$("co"),$("sa")][i].value+"%");
 $("bd").textContent=`${Q[q].n} • ${v.videoWidth||"…"}×${v.videoHeight||"…"} • ${Z.toFixed(1)}x`;
 $("zr").value=Z;document.querySelectorAll(".z").forEach(b=>b.classList.toggle("on",Math.abs(+b.dataset.z-Z)<.06))}
function grid(){const g=$("gr"),l="#ffffff55",L=(p,d)=>`linear-gradient(${d},transparent calc(${p} - .5px),${l} ${p},transparent calc(${p} + .5px))`;
 const S=[null,[L("33.3%","90deg"),L("66.6%","90deg"),L("33.3%","0deg"),L("66.6%","0deg")],[L("25%","90deg"),L("50%","90deg"),L("75%","90deg"),L("25%","0deg"),L("50%","0deg"),L("75%","0deg")],[L("38.2%","90deg"),L("61.8%","90deg"),L("38.2%","0deg"),L("61.8%","0deg")],[L("50%","to top right"),L("50%","to top left"),L("50%","90deg"),L("50%","0deg")]][gm];
 g.style.display=S?"block":"none";if(S)g.style.background=S.join(",");$("bG").classList.toggle("on",!!gm)}

/* ---------- تشغيل الكاميرا ---------- */
async function start(){
 try{stream&&stream.getTracks().forEach(t=>t.stop());const o=Q[q];
  const vd={width:{ideal:o.w},height:{ideal:o.h},frameRate:{ideal:q=="vlow"?15:fps}};
  devId?vd.deviceId={exact:devId}:vd.facingMode=facing;
  stream=await navigator.mediaDevices.getUserMedia({video:vd,audio:$("au").checked});
  v.srcObject=stream;track=stream.getVideoTracks()[0];caps=track.getCapabilities?track.getCapabilities():{};
  ic=window.ImageCapture?new ImageCapture(track):null;pc=null;if(ic)try{pc=await ic.getPhotoCapabilities()}catch(e){}
  $("ms").style.display="none";
  try{cams=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind=="videoinput")}catch(e){}
  await new Promise(r=>v.readyState>1?r():v.onloadedmetadata=r);
  pro();fit();await setZ(Z,1);const s=track.getSettings();
  $("cp").textContent=`الدقة الفعلية للمعاينة: ${s.width}×${s.height} • ${Math.round(s.frameRate||0)} إطار/ث`+(pc&&pc.imageWidth?` • أقصى دقة صورة: ${pc.imageWidth.max}×${pc.imageHeight.max}`:"")+(caps.zoom?` • مدى التكبير بالعتاد ${caps.zoom.min}–${caps.zoom.max}x`:" • التكبير برمجي فقط");
 }catch(e){$("ms").style.display="flex";$("ms").innerHTML="تعذر فتح الكاميرا.<br>"+(location.protocol=="http:"&&location.hostname!="localhost"?"الكاميرا تحتاج HTTPS.":"تأكد من السماح بإذن الكاميرا.")+"<br><button class='chip' onclick='start()' style='margin-top:12px'>إعادة المحاولة</button>"}}
async function setZ(z,quiet){
 Z=Math.min(10,Math.max(.6,z));const cz=caps.zoom;hwZ=1;
 if(cz){if(Z<cz.min){const u=cams.find(d=>/ultra|0\.5|wide/i.test(d.label)&&!/front|user/i.test(d.label)&&d.deviceId!=devId);if(u&&!quiet){devId=u.deviceId;return start()}}
  hwZ=Math.min(Math.max(Z,cz.min),cz.max);try{await track.applyConstraints({advanced:[{zoom:hwZ}]})}catch(e){}}
 if(Z<hwZ&&Z<1&&!quiet&&hwZ>=1){if(!setZ.w){setZ.w=1;toast("0.6x يحتاج عدسة واسعة؛ جهازك ما يوفرها للمتصفح")}Z=hwZ}
 view()}
function pro(){$("pro").innerHTML=PRO.map(([c,l])=>caps[c]?`<label class="s">${l} <b id="pv_${c}">تلقائي</b></label><input type="range" data-p="${c}" min="${caps[c].min}" max="${caps[c].max}" step="${caps[c].step||(caps[c].max-caps[c].min)/100}"><button class="chip" data-a="${c}">تلقائي</button>`:"").join("")||`<div class="mini">المتصفح/الجهاز ما يدعم التحكم اليدوي (ISO، غالق، تركيز). جرب Chrome على أندرويد. استخدم HDR والفلاتر من الأعلى.</div>`}

/* ---------- الالتقاط ---------- */
function beep(){if(!$("sn").checked)return;try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=1300;g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.stop(a.currentTime+.13)}catch(e){}}
function pOpt(){const o={};if(pc&&pc.imageWidth&&q!="low"&&q!="vlow"){o.imageWidth=pc.imageWidth.max;o.imageHeight=pc.imageHeight.max}if(flash&&pc&&pc.fillLightMode&&pc.fillLightMode.includes("flash"))o.fillLightMode="flash";return o}
async function grab(){if(ic)try{return await createImageBitmap(await ic.takePhoto(pOpt()))}catch(e){}return createImageBitmap(v)}
function fuse(bs,gs){let w=bs[0].width,h=bs[0].height;const k=Math.min(1,3000/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
 const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");
 const D=bs.map(b=>{x.drawImage(b,0,0,w,h);return x.getImageData(0,0,w,h).data}),out=x.createImageData(w,h),o=out.data,n=w*h*4;
 for(let p=0;p<n;p+=4){let R=0,G=0,B=0,S=0;for(let i=0;i<D.length;i++){const d=D[i],g=gs[i],r=Math.min(255,d[p]*g),e=Math.min(255,d[p+1]*g),b=Math.min(255,d[p+2]*g),l=(r*.299+e*.587+b*.114)/255,wt=Math.exp(-((l-.5)**2)/.08)+1e-4;R+=r*wt;G+=e*wt;B+=b*wt;S+=wt}o[p]=R/S;o[p+1]=G/S;o[p+2]=B/S;o[p+3]=255}
 x.putImageData(out,0,0);return c}
function compose(src){const o=Q[q],sw=src.width,sh=src.height,s=soft(),cw=sw/s,ch=sh/s,k=Math.min(1,o.cap/Math.max(cw,ch))*o.s,W=Math.max(2,Math.round(cw*k)),H=Math.max(2,Math.round(ch*k));
 const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.save();try{x.filter=css()}catch(e){}
 if(mirOut()){x.translate(W,0);x.scale(-1,1)}x.drawImage(src,(sw-cw)/2,(sh-ch)/2,cw,ch,0,0,W,H);x.restore();ov(x,W,H,ovT);return c}
async function photo(){
 $("fl").classList.remove("go");void $("fl").offsetWidth;$("fl").classList.add("go");beep();navigator.vibrate&&navigator.vibrate(25);
 let src;
 if(hdr){toast("HDR… ثبّت الجوال");const e=caps.exposureCompensation;
  if(e){const bs=[],cur=track.getSettings().exposureCompensation||0;for(const val of[e.min*.6,0,e.max*.6]){try{await track.applyConstraints({advanced:[{exposureCompensation:val}]})}catch(x){}await sl(350);bs.push(await grab())}
   try{await track.applyConstraints({advanced:[{exposureCompensation:cur}]})}catch(x){}src=fuse(bs,[1,1,1])}
  else{const b=await grab();src=fuse([b,b,b],[.5,1,2])}}
 else src=await grab();
 compose(src).toBlob(b=>add(b,"image/jpeg"),"image/jpeg",Q[q].jq)}
async function countdown(n){const c=$("cn");c.style.display="flex";for(let i=n;i>0;i--){c.textContent=i;c.animate([{transform:"scale(1.5)",opacity:0},{transform:"scale(1)",opacity:1}],{duration:400});await sl(1000)}c.style.display="none"}
